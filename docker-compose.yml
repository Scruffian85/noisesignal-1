services:
  noisesignal:
    build: .
    container_name: noisesignal-automation
    restart: unless-stopped

    # Environment variables for email and configuration
    environment:
      - GMAIL_ADDRESS=${GMAIL_ADDRESS}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-daddyfandango@gmail.com}
      - TZ=${TZ:-UTC}
      - PYTHONUNBUFFERED=1

    # Volume mounts for persistent data
    volumes:
      - ./data:/app/data
      # cron jobs don't inherit the container environment, so the scripts
      # source /app/.env directly
      - ./.env:/app/.env:ro
      - ./secret.json:/app/secret.json:ro
      - ./token.pickle:/app/token.pickle
      - ./playlist_id.txt:/app/playlist_id.txt
      - noisesignal-logs:/app/data/logs

    # Health check: the container is only useful while cron is running
    healthcheck:
      test: ["CMD", "pgrep", "-x", "cron"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  noisesignal-logs:
    driver: local